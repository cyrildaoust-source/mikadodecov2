# Réchauffage du cache edge + index catalogue dans Blob — Mikado Deco
# 1. POST /api/cron/catalog-index (secret CATALOG_INDEX_SECRET) : l'index est reconstruit et écrit
#    dans Vercel Blob ; toutes les instances le lisent ensuite en un appel (ADR 0002, étape 2).
#    Le Cron Vercel du plan Hobby ne permet qu'un passage par jour : c'est GitHub qui cadence.
# 2. Visites des listes pour garder l'edge chaud.
# L'index du catalogue (/index-catalogue/<part>.json, gardé 15 min à l'edge puis servi
# périmé jusqu'à 24 h pendant sa régénération) et les pages de listes les plus vues sont
# visités toutes les 30 minutes. Résultat : la régénération coûteuse (dizaines d'appels
# Shopify) se fait en arrière-plan à l'edge, jamais dans la requête d'un visiteur, et
# un déploiement ou un cold start ne laisse plus un visiteur attendre une construction.
# Sans infrastructure supplémentaire (voir docs/adr/0002-index-catalogue.md pour l'étape
# suivante : Cron Vercel + Blob).
name: Warm cache

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  warm:
    name: Index et listes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SECRET: ${{ secrets.CATALOG_INDEX_SECRET }}
    steps:
      - name: Reconstruire l'index catalogue dans Blob (route protégée, ADR 0002 étape 2)
        if: env.SECRET != ''
        run: |
          curl -s --max-time 290 -X POST -H "Authorization: Bearer $SECRET" -H "User-Agent: mikado-warm/1" \
            -w "\nHTTP %{http_code}  %{time_total}s\n" https://www.mikadodeco.be/api/cron/catalog-index || echo "échec (ignoré : le repli CDN reste en place)"
      - name: Visiter les URL clés (en parallèle, tolérant aux échecs)
        run: |
          base="https://www.mikadodeco.be"
          urls="/index-catalogue/membres.json /index-catalogue/0.json /index-catalogue/1.json /index-catalogue/2.json /index-catalogue/3.json \
                /produits.html /collections/chaises /collections/tables /collections/luminaires /collections/decoration \
                /collections/rangement /collections/accessoires /collections/outdoor /collections/sieges"
          for u in $urls; do
            ( printf "%-36s " "$u"; curl -s -o /dev/null --max-time 120 -H "User-Agent: mikado-warm/1" \
                -w "HTTP %{http_code}  %{time_total}s  edge=%header{x-vercel-cache}\n" "$base$u" || echo "échec (ignoré)" ) &
          done
          wait
          echo "Terminé : les entrées sont chaudes ou en cours de régénération à l'edge."
