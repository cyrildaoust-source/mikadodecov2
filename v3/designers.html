<!--page {"title":"Designers de mobilier — Vitra, Fermob, HAY… · Mikado Deco","description":"Les créateurs qui façonnent les collections que nous revendons.","canonical":"/designers.html"} -->
  <main id="contenu">

  <section class="subhero">
    <picture>
      <source type="image/webp"
        srcset="/images/marques-hero-640.webp 640w, /images/marques-hero-960.webp 960w, /images/marques-hero-1280.webp 1280w, /images/marques-hero-1500.webp 1500w"
        sizes="100vw" />
      <img class="subhero__img" src="/images/marques-hero.jpg" width="1500" height="1875" alt="Designers Mikado Deco" fetchpriority="high" />
    </picture>
    <div class="subhero__scrim"></div>
    <div class="subhero__in">
      <h1>Designers.</h1>
      <p>Les créateurs qui façonnent les collections que nous revendons.</p>
    </div>
  </section>

  <div class="wrap" data-breadcrumb></div>

  <!-- Bloc featured · les grands noms (20 grandes cartes) -->
  <section class="section wrap reveal" style="padding-bottom: clamp(28px, 3vw, 44px)">
    <div class="shead"><h2 class="serif">Les grands noms du design</h2></div>
    <div class="designer-grid" data-featured-grid></div>
    <script>
      /* Reserve the featured-block height before /designers-data.json comes
         back — 20 skeletons matching the real (épuré) card shape (photo 4:5 +
         name + brands, no bio). Replaced by the rendered cards in the module
         below. Without this, the block is 0px tall at first paint and the
         page below jumps when the cards inject (CLS). The A-Z index sits
         further down (below the fold) so its fill-in doesn't shift the
         viewport. */
      (function () {
        var g = document.querySelector("[data-featured-grid]");
        if (!g || g.children.length) return;   // déjà rempli en SSR → pas de squelette (anti-flash)
        var skel = '<div class="designer-card designer-card--lg designer-card--skel">'
                 + '<div class="designer-card__skel-photo"></div>'
                 + '<div class="designer-card__skel-name"></div>'
                 + '<div class="designer-card__skel-brand"></div>'
                 + "</div>";
        g.innerHTML = skel.repeat(20);
      })();
    </script>
  </section>

  <!-- Annuaire complet A-Z (tous les designers visibles) -->
  <section class="section wrap reveal" style="padding-top: clamp(28px, 3vw, 44px)">
    <div class="shead"><h2 class="serif">Tous les designers</h2><span class="plp-count" data-designer-count></span></div>
    <nav class="az-bar" data-az-bar aria-label="Index alphabétique des designers"></nav>
    <div class="az-index" data-az-index></div>
  </section>

  </main>
  <script type="module" src="/pages/designers.js"></script>
