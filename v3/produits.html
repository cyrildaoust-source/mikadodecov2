<!--page {"title":"Mobilier & objets de design — Catalogue · Mikado Deco","description":"Le catalogue Mikado Deco : mobilier, luminaires et objets de design, choisis pièce par pièce.","canonical":"/produits.html"} -->
<template data-head>
  <!-- Placé avant les feuilles de style : un script situé après elles attend leur
       chargement, ce qui retardait le préchargement du bandeau (LCP mobile). -->
  <script type="application/json" id="collection-hero-initial">null</script>
  <!-- Hero resolution + preload. The server injects a qualified brand or
       editorial collection hero from the common manifests, else the generic catalog hero; stashes the choice on
       window.__hero and preloads the chosen WebP so the LCP fetch starts
       immediately. The body <picture> reuses the SAME srcset → the LCP image is
       fetched exactly once. -->
  <script>
    (function () {
      var curatedHero = JSON.parse(document.getElementById("collection-hero-initial").textContent);
      var hero;
      if (curatedHero) {
        hero = curatedHero;
      } else {
        hero = {
          brand: false,
          srcset: "/images/produits-hero-640.webp 640w, /images/produits-hero-960.webp 960w, /images/produits-hero-1280.webp 1280w, /images/produits-hero-1600.webp 1600w",
          img: "/images/produits-hero.jpg",
          width: 1600, height: 2000,
          alt: "Catalogue Mikado Deco",
          obj: "center 70%"
        };
      }
      window.__hero = hero;
      // La photo de Mobilier ne s'affiche pas sur les pages suivantes.
      var query = new URLSearchParams(location.search);
      var m = location.pathname.match(/^\/collections\/([^\/?#]+)/);
      if (!m && !query.get('brand') && !query.get('designer') && !query.get('q') && (!query.get('coll') || query.get('coll') === 'all') && parseInt(query.get('page'), 10) > 1) return;
      var link = document.createElement("link");
      link.rel = "preload";
      link.as = "image";
      link.type = "image/webp";
      link.setAttribute("imagesrcset", hero.srcset);
      link.setAttribute("imagesizes", "100vw");
      link.setAttribute("fetchpriority", "high");
      document.head.appendChild(link);
    })();
  </script>
  <script>
    /* SEO canonical — résolu selon la route : /collections/<handle> (sans query),
       ?designer / ?brand (self avec le param), sinon catalogue /produits.html
       (params de filtre cat/sort/tag retirés). Toujours UN seul rel="canonical". */
    (function () {
      if (document.documentElement.hasAttribute('data-chair-catalog')) return;
      // Le serveur a déjà défini la canonique du lot et de ses filtres.
      if (new URLSearchParams(location.search).has('cursor')) return;
      var ORIGIN = "https://www.mikadodeco.be";
      var canon;
      /* handle / slug en minuscules : aligné sur le canonical normalisé injecté
         côté serveur (SSR) → SSR et runtime concordent, même URL mal-casée. */
      var m = location.pathname.match(/^\/collections\/([^\/?#]+)/);
      if (m) {
        canon = ORIGIN + "/collections/" + m[1].toLowerCase();
        var brand = new URLSearchParams(location.search).get("brand");
        if (brand) canon += "?brand=" + encodeURIComponent(brand.trim().toLowerCase());
      } else {
        var p = new URLSearchParams(location.search);
        if (p.get("designer"))   canon = ORIGIN + "/produits.html?designer=" + encodeURIComponent(p.get("designer").toLowerCase());
        else if (p.get("brand")) canon = ORIGIN + "/produits.html?brand=" + encodeURIComponent(p.get("brand").toLowerCase());
        else                     canon = ORIGIN + "/produits.html";
      }
      var link = document.querySelector('link[rel="canonical"]') || document.head.appendChild(document.createElement("link"));
      link.rel = "canonical";
      link.href = canon;
    })();
  </script>
  <link rel="stylesheet" href="/pages/produits.css" />
  <script>
    /* Page créateur (?designer=<slug>) — flag the document BEFORE first
       paint so styles.css can suppress the generic catalog hero / filterbar
       and offset the content under the fixed nav, with no flash or layout
       jump (CLS). The designer-hero is injected by the module below. */
    try {
      var _q = new URLSearchParams(location.search);
      if (_q.get("designer")) document.documentElement.classList.add("plp-designer");
      var _pp = location.pathname.toLowerCase();
      var _seg = _pp.indexOf("/collections/") === 0 ? _pp.slice(13).split("/")[0] : "";
      if ((_seg && _seg !== "all") || _q.get("brand")) document.documentElement.classList.add("plp-collection");
    } catch (e) {}
  </script>
  <script type="application/json" id="collection-context-initial">null</script>
</template>
  <main id="contenu">

  <section class="subhero">
    <!-- Hero <picture>, rendered from the choice resolved in <head>
         (window.__hero). Its <source> srcset matches the head preload, so the
         LCP image — already fetching in parallel with the CSS — is fetched
         exactly once. The .subhero box is a fixed height in CSS, so the image
         is never the layout driver (zero CLS). On a brand banner, onerror
         drops the WebP <source> and swaps to the generic hero — a brand page
         never shows a broken image. JS-less clients use the <noscript> hero. -->
    <script>
      (function () {
        var hero = window.__hero || {
          brand: false,
          srcset: "/images/produits-hero-640.webp 640w, /images/produits-hero-960.webp 960w, /images/produits-hero-1280.webp 1280w, /images/produits-hero-1600.webp 1600w",
          img: "/images/produits-hero.jpg", width: 1600, height: 2000,
          alt: "Catalogue Mikado Deco", obj: "center 70%"
        };
        var enc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;"); };
        // Bandeau de marque absent : shell.mjs (data-fallback="hero") retire la <source> WebP et
        // bascule sur le visuel générique. Plus de onerror inline (CSP sans 'unsafe-inline').
        var onerr = hero.brand ? ' data-fallback="hero"' : '';
        document.write(
          '<picture>' +
            '<source type="image/webp" srcset="' + enc(hero.srcset) + '" sizes="100vw">' +
            '<img class="subhero__img' + (hero.editorial ? ' editorial-photo' : '') + '" src="' + enc(hero.img) + '" ' + (hero.width && hero.height ? 'width="' + hero.width + '" height="' + hero.height + '" ' : '') +
              'alt="' + enc(hero.alt) + '" fetchpriority="high" style="' + enc(hero.editorial ? hero.style : 'object-position:' + hero.obj) + '"' + onerr + '>' +
          '</picture>'
        );
      })();
    </script>
    <!-- COLLECTION_HERO_NOSCRIPT -->
    <noscript>
      <picture>
        <source type="image/webp"
          srcset="/images/produits-hero-640.webp 640w, /images/produits-hero-960.webp 960w, /images/produits-hero-1280.webp 1280w, /images/produits-hero-1600.webp 1600w"
          sizes="100vw" />
        <img class="subhero__img" src="/images/produits-hero.jpg" width="1600" height="2000" alt="Catalogue Mikado Deco" fetchpriority="high" style="object-position: center 70%" />
      </picture>
    </noscript>
    <div class="subhero__scrim"></div>
    <div class="subhero__in">
      <h1 data-plp-title>Le catalogue</h1>
      <p data-plp-sub>Mobilier de design, choisi pièce par pièce.</p>
    </div>
  </section>
  <script>
    /* Page collection/marque : vide le titre + sous-titre génériques DÈS le parsing
       (avant le 1er paint) — le module pose le nom exact ensuite. Zéro flash « Le catalogue ». */
    if (document.documentElement.classList.contains("plp-collection") && !document.querySelector('[data-plp-title][data-context]')) {
      var _pt = document.querySelector("[data-plp-title]"); if (_pt) _pt.textContent = "";
      var _ps = document.querySelector("[data-plp-sub]"); if (_ps) _ps.textContent = "";
    }
  </script>

  <div class="wrap" data-breadcrumb></div>

  <!-- Page créateur · en-tête portrait + bio (rempli par le module ;
       masqué/inerte en mode catalogue normal). -->
  <div class="wrap" data-designer-hero></div>
  <script>
    /* Reserve the designer-hero height before /designers-data.json resolves
       so the swap skeleton → real content doesn't shift the page (CLS). On
       desktop the portrait (4:5) dominates the row height, so the variable
       bio length barely moves the layout. */
    (function () {
      if (!document.documentElement.classList.contains("plp-designer")) return;
      var el = document.querySelector("[data-designer-hero]");
      if (!el || el.children.length) return;   // portrait déjà envoyé par le serveur : le garder
      el.innerHTML =
        '<div class="designer-hero designer-hero--skel">'
      +   '<div class="designer-hero__photo"></div>'
      +   '<div class="designer-hero__body">'
      +     '<div class="dh-skel dh-skel--title"></div>'
      +     '<div class="dh-skel dh-skel--line"></div>'.repeat(7)
      +     '<div class="dh-skel dh-skel--brands"></div>'
      +   '</div>'
      + '</div>';
    })();
  </script>

    <script>
      /* Page créateur : efface "Tout le catalogue" DÈS le parsing (avant le
         premier paint) — aucun flash. Le module pose "Les pièces de {name}"
         dès que le designer est résolu (~15 ms). Le min-height (inline <style>)
         réserve la ligne → pas de décalage (CLS). */
      if (document.documentElement.classList.contains("plp-designer") || document.documentElement.classList.contains("plp-collection")) {
        var _gt = document.querySelector("[data-grid-title]"); if (_gt) _gt.textContent = "";
      }

  <script>
    /* La barre de filtres colle PILE sous le chrome (annonce + nav). Sa hauteur
       réelle varie (annonce présente ou non) alors que le CSS fige top:116px →
       bande vide où les produits transparaissaient. On mesure la hauteur RÉELLE
       du chrome et on cale le sticky-top dessus. (Mobile = filterbar static → top
       ignoré, sans effet.) */
    (function () {
      var chrome = document.querySelector('.chrome, [data-chrome]');
      var bar = document.querySelector('.filterbar');
      if (!chrome || !bar) return;
      var sync = function () {
        var h = Math.round(chrome.getBoundingClientRect().height);
        if (h) bar.style.top = h + 'px';
        var landing = document.querySelector('[data-catalogue-landing]');
        if (h && landing) landing.style.setProperty('--plp-chrome-height', h + 'px');
        // Le titre reste visible après le CTA, la pagination et un retour PDP,
        // y compris lorsque la barre de filtres occupe plusieurs lignes.
        var head = document.querySelector('.grid-head');
        var stickyHeight = getComputedStyle(bar).position === 'sticky' ? bar.getBoundingClientRect().height : 0;
        if (head) head.style.scrollMarginTop = Math.ceil(h + stickyHeight + 20) + 'px';
      };
      sync();
      requestAnimationFrame(sync);
      addEventListener('load', sync);
      addEventListener('resize', sync, { passive: true });
      if ('ResizeObserver' in window) {
        var observer = new ResizeObserver(sync);
        observer.observe(chrome);
        observer.observe(bar);
      }
    })();
  </script>
