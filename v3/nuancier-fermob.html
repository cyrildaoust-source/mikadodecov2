<!--page {"title":"Nuancier Fermob · Mikado Deco","description":"Le nuancier complet Fermob 2026 — 25 nuances signature, leurs ambiances, leurs harmonies.","canonical":"/nuancier-fermob.html"} -->
<template data-head>
  <link rel="preconnect" href="https://www.fermob.com" />
  <link rel="stylesheet" href="/nuancier-fermob.css" />
</template>
  <main id="contenu" class="page wrap">
    <div data-breadcrumb></div>
    <h1 class="serif">Nuancier Fermob 2026 — 25 nuances signature</h1>
    <div id="nf-root"></div>
  </main>

  <section class="section wrap reveal" style="text-align:center">
    <h2 class="serif" style="font-size:clamp(26px,2.6vw,38px);margin-bottom:18px">Envie d'aller plus loin ?</h2>
    <p style="color:var(--muted);margin-bottom:22px">Le guide couleur complet, ou les pièces Fermob disponibles.</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px">
      <a href="/journal/comment-choisir-couleur-fermob.html" class="btn btn--outline">Lire le guide couleur</a>
      <a href="/collections/fermob" class="btn btn--blue">Voir les pièces Fermob</a>
    </div>
  </section>
  <script type="module">
    import { initShell } from "/shell.mjs";
    import { mountNuancier } from "/nuancier-fermob.js";

    initShell({ active: "Le journal", transparentNav: false });

    (async () => {
      try {
        // Couleurs écrites dans la page par le serveur ; fichier en secours.
        const inline = document.getElementById("nf-data");
        const colors = inline ? JSON.parse(inline.textContent) : await fetch("/nuancier-fermob.data.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
        // Standalone page: skip scroll-on-load (host is already near top).
        mountNuancier(document.getElementById("nf-root"), colors, { scrollOnLoad: false });
      } catch (err) {
        console.warn("[nuancier] load failed:", err.message);
        document.getElementById("nf-root").innerHTML =
          `<p class="nf-error">Le nuancier ne s'est pas chargé. <a href="/journal.html">Retour au journal →</a></p>`;
      }
    })();
  </script>
