<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />{{robots}}
  <!-- Open Graph / Twitter Cards (aperçu au partage social) -->
  <meta property="og:type" content="{{ogType}}" />
  <meta property="og:site_name" content="Mikado Deco" />
  <meta property="og:locale" content="fr_BE" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{url}}" />{{canonical}}
  <meta property="og:image" content="{{image}}" />{{imageDims}}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{image}}" />
{{head}}
  <link rel="preconnect" href="https://use.typekit.net" />
  <link rel="preconnect" href="https://p.typekit.net" crossorigin />
  <link rel="stylesheet" href="https://use.typekit.net/gqc3ska.css" media="print" />
  <noscript><link rel="stylesheet" href="https://use.typekit.net/gqc3ska.css" /></noscript>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://use.typekit.net/af/912d1e/00000000000000007735bb33/31/l?primer=7cdcb44be4a7db8877ffa5c0007b8dd865b3bbc383831fe2ea177f62257a9191&fvd=n4&v=3" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cormorant-garamond-latin-600-normal.woff2" />
  <link rel="stylesheet" href="/styles.css" />
  <script id="mikado-head">(function(){for(var l of document.querySelectorAll('link[rel="stylesheet"][media="print"]')){if(l.sheet){l.media="all"}else{l.addEventListener("load",function(){l.media="all"},{once:true})}}window.__imgErrors=[];document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"&&t.dataset.fallback){window.__imgErrors.push(t)}},true)})()</script>
</head>
<body>
  <div id="site-header"></div>
{{content}}
  <div id="site-footer"></div>
</body>
</html>
