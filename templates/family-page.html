<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>[[TITLE]]</title>
  <meta name="description" content="[[DESCRIPTION]]" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mikado Deco" />
  <meta property="og:locale" content="fr_BE" />
  <meta property="og:title" content="[[TITLE]]" />
  <meta property="og:description" content="[[DESCRIPTION]]" />
  <meta property="og:url" content="[[URL]]" />
  <meta property="og:image" content="[[IMAGE]]" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="[[TITLE]]" />
  <meta name="twitter:description" content="[[DESCRIPTION]]" />
  <meta name="twitter:image" content="[[IMAGE]]" />
  <link rel="canonical" href="[[URL]]" />
  <link rel="preconnect" href="https://use.typekit.net" />
  <link rel="preconnect" href="https://p.typekit.net" crossorigin />
  <link rel="stylesheet" href="https://use.typekit.net/gqc3ska.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://use.typekit.net/gqc3ska.css" /></noscript>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cormorant-garamond-latin-600-normal.woff2" />
  <link rel="preload" as="image" href="[[HERO]]" fetchpriority="high" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main id="contenu" class="fam" data-family="[[HANDLE]]">
    <section class="fam-hero">
      <span class="ph"><img class="ph-img" src="[[HERO]]" alt="" fetchpriority="high"></span>
      <div class="fam-hero__scrim"></div>
      <div class="fam-hero__in">
        <p class="fam-hero__eyebrow">Mobilier &amp; objets</p>
        <h1 class="fam-hero__title">[[NAME]]</h1>
        <p class="fam-hero__desc">[[INTRO]]</p>
        <a class="fam-hero__btn" href="#grille">[[CTA]] ↓</a>
      </div>
    </section>
    [[CATEGORIES]]
    <section class="sec" data-icones-sec hidden aria-labelledby="family-icons"><h2 class="lab" id="family-icons">Les icônes</h2><div class="prow" data-icones></div></section>
    [[INSPIRATION]]
    [[BRANDS]]
    <section class="sec" id="grille" aria-labelledby="family-products">
      <div class="fam-gridhead"><h2 id="family-products">[[GRID_TITLE]]</h2><span data-count>[[COUNT]]</span></div>
      <div class="fam-grid" data-grid>[[GRID]]</div>
      <p class="fam-grid-status" data-grid-status role="status" aria-live="polite"></p>
      [[PAGINATION]]
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="application/json" id="family-initial">[[INITIAL]]</script>
  <script type="module" src="/family-page.js"></script>
</body>
</html>
